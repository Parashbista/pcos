<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCOS Health Tracker - Project Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: A1 landscape;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #1F2937;
            line-height: 1.4;
        }

        .poster {
            width: 841mm;
            height: 594mm;
            padding: 20mm;
            background: white;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15mm 20mm;
            background: white;
            border-bottom: 3px solid #6366F1;
            margin-bottom: 10mm;
        }

        .logo {
            width: 80mm;
            height: 40mm;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12pt;
            color: #666;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .title-section {
            flex: 1;
            text-align: center;
            padding: 0 20mm;
        }

        .main-title {
            font-size: 32pt;
            font-weight: bold;
            color: #1F2937;
            margin-bottom: 8mm;
            line-height: 1.2;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 30mm;
            font-size: 11pt;
            color: #4B5563;
        }

        .info-item {
            display: flex;
            align-items: center;
        }

        /* Main Content */
        .content {
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 15mm;
            margin-top: 10mm;
        }
